name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Extract source zip
        run: |
          z=$(find . -iname '*.zip' -not -path './.git/*' | head -n 1)
          if [ -z "$z" ]; then
            echo "Tidak ada file zip di repo."
            exit 1
          fi
          mkdir -p /tmp/proj
          unzip -q "$z" -d /tmp/proj
          f=$(find /tmp/proj -name settings.gradle.kts | head -n 1)
          echo "PROJ_DIR=$(dirname "$f")" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: ${{ env.PROJ_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Copy APK
        run: cp "$PROJ_DIR"/app/build/outputs/apk/debug/app-debug.apk KAKORO-INJECTOR.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}-${{ github.run_attempt }}" KAKORO-INJECTOR.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "Debug APK" \
            --repo "${{ github.repository }}"
