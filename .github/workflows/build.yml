name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Extract source zip
        run: |
          z=$(find . -iname '*.zip' -not -path './.git/*' | head -n 1)
          if [ -z "$z" ]; then
            echo "Tidak ada file zip di repo. Isi repo:"
            find . -maxdepth 2 -not -path './.git/*'
            exit 1
          fi
          echo "Memakai zip: $z"
          mkdir -p /tmp/proj
          unzip -q "$z" -d /tmp/proj
          f=$(find /tmp/proj -name settings.gradle.kts | head -n 1)
          if [ -z "$f" ]; then
            echo "settings.gradle.kts tidak ada di dalam zip"
            exit 1
          fi
          echo "PROJ_DIR=$(dirname "$f")" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: ${{ env.PROJ_DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: KAKORO-INJECTOR-debug-apk
          path: ${{ env.PROJ_DIR }}/app/build/outputs/apk/debug/*.apk
