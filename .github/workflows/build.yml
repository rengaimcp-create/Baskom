name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Extract source zip
        run: |
          mkdir -p /tmp/proj
          unzip -q KAKORO_INJECTOR_source.zip -d /tmp/proj
          f=$(find /tmp/proj -name settings.gradle.kts | head -n 1)
          echo "PROJ_DIR=$(dirname "$f")" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: ${{ env.PROJ_DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: KAKORO-INJECTOR-debug-apk
          path: ${{ env.PROJ_DIR }}/app/build/outputs/apk/debug/*.apk
